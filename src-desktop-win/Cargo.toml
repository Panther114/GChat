[package]
name = "gchat-desktop-win"
version = "1.3.11"
description = "Thin WebView2 desktop shell for Gchat (Windows production path)"
edition = "2021"
rust-version = "1.77"
publish = false

[[bin]]
name = "Gchat"
path = "src/main.rs"

[dependencies]
arboard = "3.4"
base64 = "0.22"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp"] }
muda = "0.16"
open = "5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
single-instance = "0.3"
tao = "0.32"
tray-icon = "0.20"
ureq = { version = "2.12", default-features = false, features = ["tls"] }
url = "2.5"
winreg = "0.55"
wry = "0.50"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
