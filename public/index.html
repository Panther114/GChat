<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="description" content="Encrypted group messaging" />
  <meta name="application-name" content="GChat" />
  <meta name="theme-color" content="#0a0a0f" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="GChat" />
  <link rel="manifest" href="/manifest.json?v=20260716-v132" />
  <link rel="icon" href="/favicon.png?v=20260716-v132" type="image/png" />
  <link rel="apple-touch-icon" href="/gchat_icon.png?v=20260716-v132" type="image/png" sizes="1254x1254" />
  <title>GChat  — Sign In</title>
  <script src="theme-init.js?v=1.3.4-release1"></script>
  <link rel="stylesheet" href="style.css?v=1.3.4-release1" />
</head>
<body class="auth-body">
  <button class="auth-theme-toggle" id="auth-theme-toggle" type="button" aria-label="Switch to light mode" title="Switch to light mode">☀</button>
  <div class="auth-card">
    <!-- Logo / Brand -->
    <div class="auth-logo">
      <img class="auth-logo-icon" src="/gchat_icon.png?v=20260716-v132" data-dark-src="/gchat_icon.png?v=20260716-v132" data-light-src="/gchat_icon_light.png" alt="GChat logo" />
      <h1 class="auth-title">GChat <span></span></h1>
      <p class="auth-subtitle">Encrypted Group Messaging</p>
    </div>

    <!-- Tabs -->
    <div class="auth-tabs" id="auth-tabs">
      <button class="auth-tab active" data-tab="signin">Sign In</button>
      <button class="auth-tab" data-tab="signup">Sign Up</button>
    </div>

    <!-- Sign In Form -->
    <form id="signin-form" class="auth-form active" novalidate>
      <div class="form-group">
        <label for="signin-username">Username</label>
        <input
          type="text"
          id="signin-username"
          placeholder="Enter your username"
          autocomplete="username"
          required
        />
      </div>
      <div class="form-group">
        <label for="signin-password">Password</label>
        <input
          type="password"
          id="signin-password"
          placeholder="Enter your password"
          autocomplete="current-password"
          required
        />
      </div>
      <label class="checkbox-row" for="signin-remember">
        <input type="checkbox" id="signin-remember" checked />
        <span>Remember me on this device</span>
      </label>
      <p class="form-error" id="signin-error"></p>
      <button type="submit" class="btn-primary" id="signin-btn">Sign In</button>
    </form>

    <!-- Sign Up Form -->
    <form id="signup-form" class="auth-form" novalidate>
      <div class="form-group">
        <label for="signup-username">Username</label>
        <input
          type="text"
          id="signup-username"
          placeholder="Choose a username (2–32 chars)"
          autocomplete="username"
          required
        />
      </div>
      <div class="form-group">
        <label for="signup-password">Password</label>
        <input
          type="password"
          id="signup-password"
          placeholder="At least 6 characters"
          autocomplete="new-password"
          required
        />
      </div>
      <div class="form-group">
        <label for="signup-confirm">Confirm Password</label>
        <input
          type="password"
          id="signup-confirm"
          placeholder="Repeat your password"
          autocomplete="new-password"
          required
        />
      </div>
      <div class="form-group form-group-color">
        <label for="signup-color">Icon Color</label>
        <div class="color-pick-row">
          <input type="color" id="signup-color" value="#4A90D9" />
          <span class="color-preview" id="color-preview">●</span>
        </div>
      </div>
      <p class="form-error" id="signup-error"></p>
      <button type="submit" class="btn-primary" id="signup-btn">Create Account</button>
    </form>


  </div>

  <script src="/pwa.js?v=1.3.3-release1"></script>
  <script src="auth.js?v=20260723-v134"></script>
</body>
</html>
