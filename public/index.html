<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="description" content="Encrypted group messaging" />
  <meta name="application-name" content="GChat" />
  <meta name="theme-color" content="#0a0a0f" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="GChat" />
  <link rel="manifest" href="/manifest.json?v=20260512-v125" />
  <link rel="icon" href="/gchat_icon.png?v=20260512-v125" type="image/png" />
  <link rel="apple-touch-icon" href="/gchat_icon.png?v=20260512-v125" type="image/png" sizes="1254x1254" />
  <title>GChat  — Sign In</title>
  <script src="theme-init.js?v=20260512-v124"></script>
  <link rel="stylesheet" href="style.css?v=20260512-v124" />
</head>
<body class="auth-body">
  <div class="auth-card">
    <!-- Logo / Brand -->
    <div class="auth-logo">
      <img class="auth-logo-icon" src="/gchat_icon.png?v=20260512-v125" alt="GChat logo" />
      <h1 class="auth-title">GChat <span></span></h1>
      <p class="auth-subtitle">Encrypted Group Messaging</p>
    </div>

    <!-- Tabs (hidden when email verification panels are shown) -->
    <div class="auth-tabs" id="auth-tabs">
      <button class="auth-tab active" data-tab="signin">Sign In</button>
      <button class="auth-tab" data-tab="signup">Sign Up</button>
    </div>

    <!-- Sign In Form -->
    <form id="signin-form" class="auth-form active" novalidate>
      <div class="form-group">
        <label for="signin-username">Username</label>
        <input
          type="text"
          id="signin-username"
          placeholder="Enter your username"
          autocomplete="username"
          required
        />
      </div>
      <div class="form-group">
        <label for="signin-password">Password</label>
        <input
          type="password"
          id="signin-password"
          placeholder="Enter your password"
          autocomplete="current-password"
          required
        />
      </div>
      <label class="checkbox-row" for="signin-remember">
        <input type="checkbox" id="signin-remember" checked />
        <span>Remember me on this device</span>
      </label>
      <p class="form-error" id="signin-error"></p>
      <button type="submit" class="btn-primary" id="signin-btn">Sign In</button>
    </form>

    <!-- Sign Up Form -->
    <form id="signup-form" class="auth-form" novalidate>
      <div class="form-group">
        <label for="signup-username">Username</label>
        <input
          type="text"
          id="signup-username"
          placeholder="Choose a username (2–32 chars)"
          autocomplete="username"
          required
        />
      </div>
      <div class="form-group">
        <label for="signup-email">Email</label>
        <input
          type="email"
          id="signup-email"
          placeholder="Enter your email address"
          autocomplete="email"
          required
        />
      </div>
      <div class="form-group">
        <label for="signup-password">Password</label>
        <input
          type="password"
          id="signup-password"
          placeholder="At least 6 characters"
          autocomplete="new-password"
          required
        />
      </div>
      <div class="form-group">
        <label for="signup-confirm">Confirm Password</label>
        <input
          type="password"
          id="signup-confirm"
          placeholder="Repeat your password"
          autocomplete="new-password"
          required
        />
      </div>
      <div class="form-group form-group-color">
        <label for="signup-color">Icon Color</label>
        <div class="color-pick-row">
          <input type="color" id="signup-color" value="#4A90D9" />
          <span class="color-preview" id="color-preview">●</span>
        </div>
      </div>
      <p class="form-error" id="signup-error"></p>
      <button type="submit" class="btn-primary" id="signup-btn">Create Account</button>
    </form>

    <!-- Email Verification Panel (unified: email entry + code verification) -->
    <div id="verify-email-form" class="auth-form" role="form">
      <!-- Step 1: Email entry (shown when user has no email on file) -->
      <div id="verify-step1">
        <p class="auth-verify-info">Enter your email address to receive a verification code. Your username and chat history are preserved.</p>
        <div class="form-group">
          <label for="verify-email-input">Email Address</label>
          <input
            type="email"
            id="verify-email-input"
            placeholder="Enter your email address"
            autocomplete="email"
          />
        </div>
        <p class="form-error" id="verify-step1-error"></p>
        <button type="button" class="btn-primary" id="send-code-btn">Send Verification Code</button>
      </div>
      <!-- Step 2: Code entry (shown after code is sent) -->
      <div id="verify-step2" style="display:none">
        <p class="auth-verify-info" id="verify-email-info">A 6-digit verification code has been sent to your email. Enter it below.</p>
        <div class="form-group">
          <label for="verify-code-input">Verification Code</label>
          <input
            type="text"
            id="verify-code-input"
            placeholder="Enter 6-digit code"
            autocomplete="one-time-code"
            maxlength="6"
            inputmode="numeric"
            pattern="\d{6}"
            required
          />
        </div>
        <p class="form-error" id="verify-email-error"></p>
        <button type="button" class="btn-primary" id="verify-email-btn">Verify Email</button>
        <button type="button" class="btn-secondary" id="resend-code-btn" style="margin-top:8px;">Resend Code</button>
      </div>
    </div>
  </div>

  <script src="/pwa.js?v=20260512-v124"></script>
  <script src="auth.js?v=20260512-v124"></script>
</body>
</html>
