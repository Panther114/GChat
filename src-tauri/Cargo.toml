[package]
name = "gchat-desktop"
version = "1.3.8"
description = "Lightweight desktop shell for the hosted Gchat application"
authors = ["Gchat"]
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "gchat_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "Gchat"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2.5.6", features = [] }

[dependencies]
arboard = "3.6.1"
base64 = "0.22.1"
image = { version = "0.25.9", default-features = false, features = ["gif", "jpeg", "png", "webp"] }
open = "5.3.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tauri = { version = "2.11.5", features = ["image-png", "tray-icon"] }
tauri-plugin-autostart = "2.5.1"
tauri-plugin-notification = "2.3.3"
tauri-plugin-single-instance = "2.4.3"
tauri-plugin-updater = "2.10.1"
tokio = { version = "1.48", features = ["time"] }
url = "2.5"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
