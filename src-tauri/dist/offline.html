<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Gchat — Connection unavailable</title>
  <style>
    :root { color-scheme: dark; font-family: Inter, system-ui, sans-serif; }
    * { box-sizing: border-box; }
    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      color: #f4f7ff;
      background: #0b1020;
    }
    main {
      width: min(520px, calc(100vw - 40px));
      padding: 38px;
      border: 1px solid #27304d;
      border-radius: 20px;
      background: #11182b;
      box-shadow: 0 24px 80px rgb(0 0 0 / 35%);
    }
    h1 { margin: 0 0 12px; font-size: 28px; }
    p { margin: 0 0 22px; color: #aeb8d2; line-height: 1.55; }
    button {
      border: 1px solid #7c5cfc;
      border-radius: 10px;
      padding: 11px 18px;
      color: white;
      background: #6d4df1;
      font: inherit;
      font-weight: 700;
      cursor: pointer;
      transition: transform 180ms ease-out, background-color 180ms ease-out;
    }
    button:hover { background: #7c5cfc; transform: translateY(-1px); }
    button:active { transform: translateY(0); }
    button:disabled { cursor: wait; opacity: .65; }
    small { display: block; margin-top: 18px; color: #6f7b9c; }
  </style>
</head>
<body>
  <main>
    <h1>Gchat is offline</h1>
    <p>The desktop app could not reach the hosted Gchat service. Check your connection and try again.</p>
    <button id="retry" type="button">Retry connection</button>
    <small id="server"></small>
  </main>
  <script>
    const button = document.getElementById('retry');
    const server = document.getElementById('server');
    const api = window.electronAPI;
    if (api?.getConnectionContext) {
      api.getConnectionContext()
        .then((context) => {
          server.textContent = context?.serverUrl || 'https://gchat.up.railway.app';
        })
        .catch(() => {
          server.textContent = 'https://gchat.up.railway.app';
        });
    } else {
      server.textContent = 'https://gchat.up.railway.app';
    }
    button.addEventListener('click', async () => {
      button.disabled = true;
      button.textContent = 'Connecting…';
      try {
        if (!api?.retryConnection) throw new Error('Desktop bridge unavailable');
        await api.retryConnection();
      } catch {
        button.disabled = false;
        button.textContent = 'Retry connection';
      }
    });
  </script>
</body>
</html>
