name: Build desktop releases

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --include=dev
      - run: npm run verify

  build-windows:
    needs: verify
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-desktop-win
      - run: npm ci --include=dev
      - name: Verify release tag matches package version
        if: startsWith(github.ref, 'refs/tags/')
        shell: node {0}
        run: |
          const path = require('node:path');
          const { version } = require(path.join(process.env.GITHUB_WORKSPACE, 'package.json'));
          if (process.env.GITHUB_REF_NAME !== `v${version}`) {
            throw new Error(`Tag ${process.env.GITHUB_REF_NAME} does not match v${version}`);
          }
      - name: Test thin Windows shell
        run: cargo test --manifest-path src-desktop-win/Cargo.toml
      - name: Install NSIS (makensis)
        shell: pwsh
        run: choco install nsis -y --no-progress
      - name: Build thin Windows installer
        run: npm run build:win
      - name: Sign thin Windows installer (minisign)
        # The thin shell verifies a sibling <installer>.sig against the Tauri
        # updater pubkey before executing updates. Sign with the same keypair
        # the Tauri updater uses (tauri.conf.json "pubkey").
        shell: pwsh
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          if (-not $env:TAURI_SIGNING_PRIVATE_KEY) { throw 'TAURI_SIGNING_PRIVATE_KEY secret is required to sign the thin-shell installer' }
          $installer = Get-ChildItem src-desktop-win/target/release/bundle/Gchat_*_x64-setup.exe | Select-Object -First 1
          if (-not $installer) { throw 'Installer not produced' }
          npx --yes @tauri-apps/cli@2 signer sign $installer.FullName
          if (-not (Test-Path "$($installer.FullName).sig")) { throw 'Signature file not produced' }
      - name: Stage artifacts
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force staging | Out-Null
          Copy-Item src-desktop-win/target/release/bundle/Gchat_*_x64-setup.exe staging/ -ErrorAction Stop
          Copy-Item src-desktop-win/target/release/bundle/Gchat_*_x64-setup.exe.sig staging/ -ErrorAction Stop
      - name: Enforce artifact size budgets
        run: node scripts/check-desktop-artifact-budgets.js staging
      - uses: actions/upload-artifact@v4
        with:
          name: gchat-windows-desktop
          path: staging/*
          if-no-files-found: error

  build-macos:
    needs: verify
    runs-on: macos-latest
    permissions:
      contents: read
    env:
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci --include=dev
      - name: Test Tauri macOS fallback shell
        run: cargo test --manifest-path src-tauri/Cargo.toml
      - name: Build macOS Tauri packages
        run: npm run build:mac
      - name: Stage artifacts
        shell: bash
        run: |
          mkdir -p staging
          find src-tauri/target/universal-apple-darwin/release/bundle \
            -type f \( -name '*.dmg' -o -name '*.app.tar.gz' -o -name '*.sig' \) \
            -exec cp {} staging/ \; || true
          find src-tauri/target -type f \( -name '*.dmg' -o -name '*.app.tar.gz' \) \
            -exec cp {} staging/ \; 2>/dev/null || true
      - uses: actions/upload-artifact@v4
        with:
          name: gchat-macos-desktop
          path: staging/*
          if-no-files-found: warn

  publish-release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [build-windows, build-macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: release
          merge-multiple: true
      - name: Generate Tauri updater manifest (latest.json)
        run: >-
          node scripts/generate-tauri-update-manifest.js
          release "$GITHUB_REF_NAME" "$GITHUB_REPOSITORY"
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "$GITHUB_REF_NAME"
          release/*
          --repo "$GITHUB_REPOSITORY"
          --verify-tag
          --generate-notes
          --title "Gchat ${GITHUB_REF_NAME#v}"
          --latest
