name: Build desktop releases

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --include=dev
      - run: npm run verify

  build-desktop:
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: Windows
            runner: windows-latest
            target: x86_64-pc-windows-msvc
            command: npm run build:win
            artifact: gchat-windows-desktop
          - platform: macOS
            runner: macos-latest
            target: universal-apple-darwin
            command: npm run build:mac
            artifact: gchat-macos-desktop
    name: Build ${{ matrix.platform }} desktop
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    env:
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target == 'universal-apple-darwin' && 'aarch64-apple-darwin,x86_64-apple-darwin' || matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: npm ci --include=dev

      - name: Verify release tag matches package version
        if: startsWith(github.ref, 'refs/tags/')
        shell: node {0}
        run: |
          const { version } = require('./package.json');
          if (process.env.GITHUB_REF_NAME !== `v${version}`) {
            throw new Error(`Tag ${process.env.GITHUB_REF_NAME} does not match v${version}`);
          }

      - name: Test native shell
        run: npm run test:desktop

      - name: Build desktop packages
        run: ${{ matrix.command }}

      - name: Collect Windows artifacts
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force staging | Out-Null
          Get-ChildItem src-tauri/target/release/bundle -File -Recurse |
            Where-Object { $_.Name -match '\.(exe|sig)$' } |
            Copy-Item -Destination staging

      - name: Collect macOS artifacts
        if: runner.os == 'macOS'
        shell: bash
        run: |
          mkdir -p staging
          find src-tauri/target/universal-apple-darwin/release/bundle \
            -type f \( -name '*.dmg' -o -name '*.app.tar.gz' -o -name '*.sig' \) \
            -exec cp {} staging/ \;

      - name: Enforce artifact size budgets
        run: node scripts/check-desktop-artifact-budgets.js staging

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: staging/*
          if-no-files-found: error

  publish-release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build-desktop
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: release
          merge-multiple: true

      - name: Generate updater manifest
        run: node scripts/generate-tauri-update-manifest.js release "$GITHUB_REF_NAME" "$GITHUB_REPOSITORY"

      - name: Publish latest stable release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "$GITHUB_REF_NAME"
          release/*
          --repo "$GITHUB_REPOSITORY"
          --verify-tag
          --generate-notes
          --title "Gchat ${GITHUB_REF_NAME#v}"
          --latest
