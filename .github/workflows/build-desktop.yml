name: Build Windows desktop

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:

jobs:
  build-windows-desktop:
    runs-on: windows-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci --include=dev

      - name: Verify release tag matches package version
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: |
          $version = (Get-Content package.json | ConvertFrom-Json).version
          if ($env:GITHUB_REF_NAME -ne "v$version") {
            throw "Tag $env:GITHUB_REF_NAME does not match package version v$version"
          }

      - name: Build Windows desktop packages
        run: npm run build:win -- --publish never

      - name: Upload desktop artifacts
        uses: actions/upload-artifact@v4
        with:
          name: gchat-windows-desktop
          path: |
            release/*.exe
            release/*.blockmap
            release/latest.yml
          if-no-files-found: error

  publish-release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build-windows-desktop
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download Windows desktop artifacts
        uses: actions/download-artifact@v4
        with:
          name: gchat-windows-desktop
          path: release

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "$GITHUB_REF_NAME"
          "release/Gchat-Setup-${GITHUB_REF_NAME#v}.exe"
          "release/Gchat-Setup-${GITHUB_REF_NAME#v}.exe.blockmap"
          "release/latest.yml"
          --repo "$GITHUB_REPOSITORY"
          --verify-tag
          --generate-notes
          --title "Gchat ${GITHUB_REF_NAME#v}"
          --latest
