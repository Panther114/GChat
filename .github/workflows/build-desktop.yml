name: Build desktop releases

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'
  pull_request:

jobs:
  build-desktop:
    name: Build ${{ matrix.platform }} desktop
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: Windows
            runner: windows-latest
            command: npm run build:win -- --publish never
            artifact: gchat-windows-desktop
            artifact_paths: |
              release/*.exe
              release/*.exe.blockmap
              release/latest.yml
          - platform: macOS
            runner: macos-latest
            command: npm run build:mac -- --publish never
            artifact: gchat-macos-desktop
            artifact_paths: |
              release/*.dmg
              release/*.dmg.blockmap
              release/*.zip
              release/*.zip.blockmap
              release/latest-mac.yml
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci --include=dev

      - name: Verify release tag matches package version
        if: startsWith(github.ref, 'refs/tags/')
        shell: node {0}
        run: |
          const path = require('node:path');
          const { version } = require(path.join(process.env.GITHUB_WORKSPACE, 'package.json'));
          const expectedTag = `v${version}`;
          if (process.env.GITHUB_REF_NAME !== expectedTag) {
            throw new Error(`Tag ${process.env.GITHUB_REF_NAME} does not match package version ${expectedTag}`);
          }

      - name: Build ${{ matrix.platform }} desktop packages
        run: ${{ matrix.command }}

      - name: Upload desktop artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact_paths }}
          if-no-files-found: error

  publish-release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build-desktop
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download desktop artifacts
        uses: actions/download-artifact@v4
        with:
          path: release
          merge-multiple: true

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "$GITHUB_REF_NAME"
          release/*
          --repo "$GITHUB_REPOSITORY"
          --verify-tag
          --generate-notes
          --title "Gchat ${GITHUB_REF_NAME#v}"
          --latest
